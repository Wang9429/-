# 中国大陆云主机上的独立运行编排。
# 用法见 docs/中国大陆部署说明.md
#
# 本文件不会把服务暴露给 Cursor 预览或临时隧道。
# 未放入证书时不要启用 nginx 的 443 端口（先用 http-bootstrap 申请证书）。

name: cnooc-supervision

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: cnooc-supervision:1.6.1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "43917"
      HOSTNAME: 0.0.0.0
      ENABLE_SOURCE_PACKAGE: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "43917"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:43917/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
